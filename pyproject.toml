[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimo-auth"
version = "0.1.0"
description = "A local Xiaomi MiMo auth profile switcher for Claude Code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "mimo-auth contributors" }
]
keywords = ["claude-code", "mimo", "auth", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mimo-auth = "mimo_auth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mimo_auth"]

