<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">mimo-auth social preview</title>
  <desc id="desc">Xiaomi MiMo profile switcher for Claude Code. Local only, no telemetry, no proxy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="72" y="72" width="1136" height="496" rx="28" fill="#020617" opacity="0.72"/>
  <rect x="72" y="72" width="1136" height="496" rx="28" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="118" cy="116" r="9" fill="#ef4444"/>
  <circle cx="148" cy="116" r="9" fill="#f59e0b"/>
  <circle cx="178" cy="116" r="9" fill="#22c55e"/>
  <text x="104" y="230" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="800">mimo-auth</text>
  <rect x="104" y="262" width="430" height="8" rx="4" fill="url(#accent)"/>
  <text x="104" y="340" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="600">Xiaomi MiMo profile switcher for Claude Code</text>
  <text x="104" y="420" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28">Local only  •  No telemetry  •  No proxy  •  Masked keys</text>
