    <text x="32" y="112" fill="#e2e8f0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">1  work-plan</text>
    <text x="32" y="150" fill="#e2e8f0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">2  personal-api</text>
    <text x="32" y="198" fill="#38bdf8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">Claude Code now uses</text>
